<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Role Play</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --primary: #2563eb; --green: #16a34a; --red: #dc2626; --soft: #eff6ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  header { height: 56px; display: flex; align-items: center; padding: 0 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 16px; letter-spacing: -.01em; }

  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 18px; border-radius: 10px; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.red { background: var(--red); border-color: var(--red); color: #fff; }

  /* Home */
  .home { max-width: 720px; margin: 0 auto; padding: 64px 16px; }
  .home h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
  .choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; color: var(--text); transition: border-color .15s, box-shadow .15s; }
  .choice:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(37, 99, 235, .08); }
  .choice .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); color: var(--primary); display: grid; place-items: center; margin-bottom: 16px; }
  .choice b { display: block; font-size: 17px; }
  .recent { margin-top: 48px; }
  .recent h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .rec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .rec summary { list-style: none; display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .rec summary::-webkit-details-marker { display: none; }
  .rec .body { padding: 0 16px 14px; white-space: pre-wrap; font-size: 14px; }

  /* Phone overlay */
  .overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, .6); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .phone { background: var(--panel); border-radius: 24px; width: 300px; max-width: 100%; padding: 36px 24px 28px; text-align: center; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--soft); color: var(--primary); display: grid; place-items: center; margin: 0 auto 18px; }
  .ringing .avatar { animation: pulse 1.3s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .5); } 70% { box-shadow: 0 0 0 22px rgba(37, 99, 235, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }
  .phone .who { font-size: 20px; font-weight: 600; }
  .actions { display: flex; justify-content: center; gap: 40px; margin-top: 28px; }
  .round { width: 60px; height: 60px; border-radius: 50%; border: 0; color: #fff; display: grid; place-items: center; }
  .round.red { background: var(--red); } .round.green { background: var(--green); }
  .round + small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }

  /* Call + after call */
  .screen { height: calc(100vh - 56px); display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar .title { font-weight: 600; margin-right: auto; display: flex; align-items: center; gap: 10px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px 24px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .pane h3 { margin: 0; padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .pane .content { flex: 1; min-height: 0; padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
  .call-split { grid-template-columns: 560px 1fr; }
  #widgetHost { display: flex; min-height: 0; }
  #widgetHost iframe { flex: 1; width: 100%; border: 0; background: transparent; color-scheme: light; }
  textarea, input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--panel); }
  textarea:focus, input:focus { outline: 2px solid var(--soft); border-color: var(--primary); }
  textarea { resize: none; }
  .pane > textarea { flex: 1; border: 0; border-radius: 0; padding: 16px; outline: none; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  .todo-add { display: flex; gap: 8px; }
  .todo { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .todo input { width: auto; }
  .todo span { flex: 1; }
  .todo.done span { text-decoration: line-through; color: var(--muted); }
  .todo button { border: 0; background: none; color: var(--muted); }

  @media (max-width: 760px) {
    .choices, .split, .call-split { grid-template-columns: 1fr; }
    #widgetHost { min-height: 760px; }
    .screen { height: auto; }
    .pane { min-height: 420px; }
    .bar, .split { padding-left: 16px; padding-right: 16px; }
    .home { padding-top: 40px; }
  }
</style>
</head>
<body>
<header><b>Role Play</b></header>

<!-- HOME -->
<section id="home" class="home">
  <h1>Start a practice call</h1>
  <div class="muted">Choose the type of call. The AI customer will talk to you like a real caller.</div>
  <div class="choices">
    <button class="choice" data-type="inbound">
      <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v6h6"/><path d="M22 2l-6 6"/><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div>
      <b>Inbound call</b>
      <span class="muted">A customer calls you</span>
    </button>
    <button class="choice" data-type="outbound">
      <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8V2h-6"/><path d="M16 8l6-6"/><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div>
      <b>Outbound call</b>
      <span class="muted">You call a customer</span>
    </button>
  </div>
  <div class="recent hidden" id="recentWrap">
    <h2>Recent calls</h2>
    <div id="recent"></div>
  </div>
</section>

<!-- CALL -->
<section id="call" class="screen hidden">
  <div class="bar">
    <div class="title"><span class="live"></span><span id="callTitle">Inbound call</span></div>
    <span class="timer" id="timer">00:00</span>
    <button class="btn primary" id="endCall">Finish &amp; write summary</button>
  </div>
  <div class="split call-split">
    <div id="widgetHost"></div>
    <div class="pane"><h3>Notes</h3><textarea id="callNotes" placeholder="Take notes during the call…"></textarea></div>
  </div>
</section>

<!-- AFTER CALL -->
<section id="acw" class="screen hidden">
  <div class="bar">
    <div class="title">After call <span class="muted" id="acwMeta" style="font-weight:400"></span></div>
    <button class="btn" id="discard">Discard</button>
    <button class="btn primary" id="save">Save</button>
  </div>
  <div class="split">
    <div class="pane">
      <h3>Summary &amp; to-do</h3>
      <div class="content">
        <div><label for="summary">Summary</label><textarea id="summary" rows="6" placeholder="What did the customer want? What happened on the call?"></textarea></div>
        <div>
          <label for="todoInput">To-do list</label>
          <div class="todo-add"><input id="todoInput" placeholder="Add a task and press Enter"><button class="btn" id="todoAdd">Add</button></div>
          <div id="todos" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
    <div class="pane"><h3>Notes from the call</h3><textarea id="acwNotes"></textarea></div>
  </div>
</section>

<!-- PHONE -->
<div id="phone" class="overlay hidden">
  <div class="phone" id="phoneCard">
    <div class="avatar"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
    <div class="muted" id="phLabel"></div>
    <div class="who">Customer</div>
    <div class="actions" id="phActions"></div>
  </div>
</div>

<script>
(() => {
  const WIDGETS = { inbound: "n6w4jfcdje", outbound: "braj8s3quq" };
  const WIDGET_SRC = "https://oneinbox-v2-widget.vercel.app/loader.js";
  const KEY = "roleplay.calls.v1";
  const PHONE_PATH = '<path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6a1 1 0 0 0-1 .2l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2a1 1 0 0 0 .3-1A11.4 11.4 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"/>';
  const ICON_CALL = `<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">${PHONE_PATH}</svg>`;
  const ICON_HANG = `<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)">${PHONE_PATH}</svg>`;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const store = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
  const label = t => t === "outbound" ? "Outbound call" : "Inbound call";

  let call = null, timerId = null, todos = [];

  function show(id) {
    ["home", "call", "acw"].forEach(s => $("#" + s).classList.toggle("hidden", s !== id));
    if (id === "home") renderRecent();
  }

  // ---- ringtone (generated, no audio file) ----
  let ctx = null, ringId = null;
  function ring(on) {
    clearInterval(ringId); ringId = null;
    if (ctx) { ctx.close().catch(() => {}); ctx = null; }
    if (!on) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const burst = () => [0, .5].forEach(off => {
        const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + off;
        o.frequency.value = 440; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02);
        g.gain.setValueAtTime(.18, t + .38); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
        o.start(t); o.stop(t + .42);
      });
      burst(); ringId = setInterval(burst, 2500);
    } catch {}
  }

  // ---- phone overlay ----
  let dialTimeout = null;
  function phone(text, ringing, buttons) {
    $("#phone").classList.remove("hidden");
    $("#phoneCard").classList.toggle("ringing", ringing);
    $("#phLabel").textContent = text;
    $("#phActions").innerHTML = buttons.map((b, i) =>
      `<div><button class="round ${b.color}" data-i="${i}" aria-label="${b.text}">${b.icon}</button><small>${b.text}</small></div>`).join("");
    $("#phActions").querySelectorAll("button").forEach(el => el.onclick = buttons[el.dataset.i].fn);
    ring(ringing);
  }
  function closePhone() { $("#phone").classList.add("hidden"); ring(false); clearTimeout(dialTimeout); }
  const cancel = () => { closePhone(); call = null; };

  document.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    call = { type: b.dataset.type };
    if (call.type === "inbound") {
      phone("Incoming call…", true, [
        { text: "Decline", color: "red", icon: ICON_HANG, fn: cancel },
        { text: "Accept", color: "green", icon: ICON_CALL, fn: () => { closePhone(); connect(); } }
      ]);
    } else {
      phone("Outbound call", false, [
        { text: "Cancel", color: "red", icon: ICON_HANG, fn: cancel },
        { text: "Call", color: "green", icon: ICON_CALL, fn: () => {
            phone("Calling…", true, [{ text: "Cancel", color: "red", icon: ICON_HANG, fn: cancel }]);
            dialTimeout = setTimeout(() => { closePhone(); connect(); }, 3500);
          } }
      ]);
    }
  });

  // ---- call ----
  function connect() {
    call.start = Date.now();
    $("#callTitle").textContent = label(call.type);
    $("#callNotes").value = "";
    // Fresh, isolated widget per call; removing the frame stops it and releases the mic.
    const f = document.createElement("iframe");
    f.setAttribute("allow", "microphone; autoplay; clipboard-write");
    f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:transparent}</style></head>
<body><oneinbox-widget public-id="${WIDGETS[call.type]}"></oneinbox-widget><script src="${WIDGET_SRC}" async><\/script></body></html>`;
    $("#widgetHost").replaceChildren(f);
    $("#timer").textContent = "00:00";
    timerId = setInterval(() => $("#timer").textContent = fmt(Math.floor((Date.now() - call.start) / 1000)), 1000);
    show("call");
  }

  $("#endCall").onclick = () => {
    clearInterval(timerId);
    call.duration = Math.floor((Date.now() - call.start) / 1000);
    $("#widgetHost").replaceChildren();
    $("#acwMeta").textContent = `· ${label(call.type)} · ${fmt(call.duration)}`;
    $("#summary").value = "";
    $("#acwNotes").value = $("#callNotes").value;
    todos = []; renderTodos();
    show("acw");
    $("#summary").focus();
  };

  // ---- after call ----
  function renderTodos() {
    $("#todos").innerHTML = todos.map((t, i) => `<div class="todo ${t.done ? "done" : ""}">
      <input type="checkbox" data-i="${i}" ${t.done ? "checked" : ""}><span>${esc(t.text)}</span><button data-del="${i}" aria-label="Remove">✕</button></div>`).join("");
    $("#todos").querySelectorAll("[data-i]").forEach(c => c.onchange = () => { todos[c.dataset.i].done = c.checked; renderTodos(); });
    $("#todos").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { todos.splice(b.dataset.del, 1); renderTodos(); });
  }
  const addTodo = () => { const v = $("#todoInput").value.trim(); if (v) { todos.push({ text: v, done: false }); $("#todoInput").value = ""; renderTodos(); } };
  $("#todoAdd").onclick = addTodo;
  $("#todoInput").onkeydown = e => { if (e.key === "Enter") addTodo(); };

  $("#discard").onclick = () => { if (confirm("Discard this call?")) { call = null; show("home"); } };
  $("#save").onclick = () => {
    const calls = load();
    calls.unshift({ type: call.type, at: call.start, duration: call.duration, summary: $("#summary").value, todos, notes: $("#acwNotes").value });
    store(calls.slice(0, 50)); call = null; show("home");
  };

  function renderRecent() {
    const calls = load();
    $("#recentWrap").classList.toggle("hidden", !calls.length);
    $("#recent").innerHTML = calls.slice(0, 10).map(c => `<details class="rec">
      <summary><span>${label(c.type)}</span><span class="muted">${new Date(c.at).toLocaleString()} · ${fmt(c.duration)}</span></summary>
      <div class="body"><b>Summary</b>\n${esc(c.summary || "—")}\n\n<b>To-do</b>\n${c.todos.length ? c.todos.map(t => (t.done ? "☑ " : "☐ ") + esc(t.text)).join("\n") : "—"}\n\n<b>Notes</b>\n${esc(c.notes || "—")}</div>
    </details>`).join("");
  }

  window.addEventListener("beforeunload", e => { if (!$("#call").classList.contains("hidden")) { e.preventDefault(); e.returnValue = ""; } });
  show("home");
})();
</script>
</body>
</html>
